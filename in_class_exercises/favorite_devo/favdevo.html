<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
        <table>
          <tr id="headings">
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Brad Wilcox</td>
            <td>“His Grace Is Sufficient”</td>
            <td>BYU Provo</td>
            <td>2011</td>
          </tr>
          <tr>
            <td>J. Ty Hopkins</td>
            <td>“Lessons on Endurance”</td>
            <td>BYU Provo</td>
            <td>2024</td>
          </tr>
          <tr>
            <td>Elder David A. Bednar</td>
            <td>“The Spirit and Purposes of Gathering”</td>
            <td>BYU Idaho</td>
            <td>2006</td>
          </tr>
        </table>  

        <form>
          <label for speaker-name>Speaker</label>
          <input type="text" id="speaker-name">
          
          <label for="title">Title</label>
          <input type="text" id="title">
          
          <label for="location">Location</label>
          <input type="text" id="location">

          <label for="year">Year</label>
          <input type="text" id="year">
          
          <input type="submit" >
        </form>
      </div>
    </main>
  </div>
</body>
</html>
