<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chango&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Chewy&display=swap');
    h1{
        text-align: center;
        color: rgb(31, 29, 29);
        font-family: 'Chango';
    }
    .text-bubble {
      background: #f1f1f1;
      padding: 12px 16px;
      border-radius: 18px;
      color: #222;
      font-family: 'Chewy';
      width: 265px;

      position: absolute;
      left: 300px;
    }
    
    .second-bubble {
      color:rgb(1, 32, 32);
      width: 150px;

      position: absolute;
      top: 100px;
      left: 650px;
    }
  </style>
</head>

<body>
    <h1>
        White Water Rafting
    </h1>

  <p class="text-bubble">
    This is my paragraph inside a text bubble. Let's make this text, wayyyyyyyy longerrrrrrr.
  </p>

  <p class = 'text-bubble second-bubble'>
    This is the secound one
  </p>

</body>
</html>
